name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    # A prose change does not need two platforms, pluginval and a 30-minute
    # sanitizer run. GitHub does not evaluate path filters for tag pushes, so a
    # release still builds regardless of what its commit happened to touch.
    #
    # Deliberately not applied to pull_request: a workflow skipped by a path
    # filter never reports a status, so if branch protection is ever turned on,
    # a docs-only PR would sit forever waiting for a check that cannot arrive.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run for the same ref. Tags are exempt:
# a release build should never be cancelled by whatever lands next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  BUILD_TYPE: Release

jobs:
  setup:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          linux='{"name":"Linux","os":"ubuntu-latest","generator":"-G Ninja","pluginval":"pluginval_Linux.zip"}'
          windows='{"name":"Windows","os":"windows-latest","generator":"","pluginval":"pluginval_Windows.zip"}'
          macos='{"name":"macOS","os":"macos-latest","generator":"-G Ninja","pluginval":"pluginval_macOS.zip"}'

          # On a private repo macOS runners bill at 10x (Windows 2x, Linux 1x),
          # and macOS is the one platform that can be tested locally for free.
          # Reserve it for tags and manual runs.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "matrix=[$linux,$windows,$macos]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=[$linux,$windows]" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev xvfb

      - name: Install Ninja
        if: runner.os == 'macOS'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Cache JUCE checkout
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-9.0.1

      # No -G Ninja on Windows: with Ninja on the PATH, CMake picks up MinGW
      # rather than MSVC and JUCE refuses to build. The default Visual Studio
      # generator is multi-config, hence --config on the build and test steps.
      - name: Configure
        shell: bash
        run: >
          cmake -B build ${{ matrix.generator }}
          -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          -DSIDECRUSH_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config $BUILD_TYPE --parallel 4
        shell: bash

      - name: Test
        run: ctest --test-dir build --build-config $BUILD_TYPE --output-on-failure
        shell: bash

      - name: Fetch pluginval
        shell: bash
        run: |
          curl -sL "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}" -o pluginval.zip
          7z x pluginval.zip -opluginval || unzip -q pluginval.zip -d pluginval

      - name: Validate VST3
        shell: bash
        run: |
          VST3=$(find build -name "SideCrush.vst3" | head -1)
          echo "validating $VST3"
          case "${{ runner.os }}" in
            macOS)   BIN="pluginval/pluginval.app/Contents/MacOS/pluginval" ;;
            Windows) BIN="pluginval/pluginval.exe" ;;
            Linux)   BIN="pluginval/pluginval"; chmod +x "$BIN" ;;
          esac
          RUN="$BIN --strictness-level 10 --verbose --validate-in-process --skip-gui-tests --validate $VST3"
          if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a $RUN; else $RUN; fi

      # Zipped here rather than by upload-artifact, which stores files without
      # their mode bits. A macOS .vst3 is a bundle whose binary has to stay
      # executable, so an artifact assembled by the upload action downloads as a
      # plug-in no host will load. The archive keeps the mode inside it, and the
      # same file is what gets attached to the release.
      - name: Package
        shell: bash
        run: |
          SRC="build/SideCrush_artefacts/$BUILD_TYPE/VST3"
          ZIP="SideCrush-${{ matrix.name }}.zip"

          # Zipped from inside the artefacts folder so the archive holds the
          # bundle and none of the build path around it. Relative paths on both
          # sides: 7z is a native Windows binary and does not read the POSIX
          # paths Git Bash hands it.
          if [ "${{ runner.os }}" = "Windows" ]; then
            ( cd "$SRC" && 7z a -tzip "$ZIP" SideCrush.vst3 > /dev/null )
          else
            # -y stores symlinks as symlinks rather than copying their targets.
            ( cd "$SRC" && zip -qry "$ZIP" SideCrush.vst3 )
          fi

          mv "$SRC/$ZIP" .
          ls -l "$ZIP"

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: SideCrush-${{ matrix.name }}
          path: SideCrush-${{ matrix.name }}.zip

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxi-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Cache JUCE checkout
        uses: actions/cache@v6
        with:
          path: build-asan/_deps
          key: Linux-juce-9.0.1-asan

      # LTO and the sanitizers do not get along; the recommended flags enable it
      # in Release, so the sanitizer build runs as RelWithDebInfo without it.
      - name: Configure
        run: >
          cmake -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DSIDECRUSH_COPY_AFTER_BUILD=OFF
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build-asan --parallel 4 --target sidecrush_engine_test sidecrush_host_test

      - name: Run
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Tags only, and the macOS slice only exists on tags -- see the setup job. The
  # release is left as a draft: the tag is the trigger, publishing is a decision.
  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist

          # All three platforms or nothing: a release missing a platform is
          # worse than a release that failed loudly.
          for name in Linux Windows macOS; do
            test -f "dist/SideCrush-$name.zip" || {
              echo "missing dist/SideCrush-$name.zip"
              exit 1
            }
          done

          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
